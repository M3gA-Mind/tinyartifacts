[package]
name = "tiny-artifacts"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared artifact types, store trait, and tools for versioned agent-generated deliverables."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tinytools = { git = "https://github.com/tinyhumansai/tinytools.git" }